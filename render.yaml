services:
  - type: web
    name: strategy-binance-v2
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: BINANCE_SYMBOL
        value: btcusdt
